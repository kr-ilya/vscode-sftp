# Servers for the file system contract suite.
#
# NOT RUN AUTOMATICALLY. `npm test` never touches these; the remote contract
# specs skip unless SYNCX_CONTRACT_SFTP / SYNCX_CONTRACT_FTP are set. Bring them
# up deliberately:
#
#   docker compose -f test/fixtures/docker/docker-compose.yml up -d --wait
#   SYNCX_CONTRACT_SFTP=1 SYNCX_CONTRACT_FTP=1 npm test
#   docker compose -f test/fixtures/docker/docker-compose.yml down -v
#
# These have now been run, and the contract suite passes against both.
#
# Restarting a stopped ftp container does not work: its entrypoint creates the
# account on every start and fails with "adduser: user 'syncx' in use" against
# the volume left behind. Recreate it (`down -v`, then `up`) rather than
# `start`.

services:
  sftp:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: syncx
      USER_PASSWORD: syncx-test
      PASSWORD_ACCESS: 'true'
      # The contract exercises chmod and utimes, which need a writable home.
      SUDO_ACCESS: 'false'
    ports:
      - '2222:2222'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 2222 || exit 1']
      interval: 2s
      timeout: 2s
      retries: 30

  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      USERS: 'syncx|syncx-test|/home/syncx|1000'
      ADDRESS: localhost
      # Passive range must be published for data connections to work.
      MIN_PORT: '21000'
      MAX_PORT: '21010'
    ports:
      - '2121:21'
      - '21000-21010:21000-21010'
    healthcheck:
      # BusyBox nc has no -z, and `localhost` does not resolve to anything
      # listening in this image -- with either, the check can never pass and
      # `up --wait` gives up on a server that is in fact running. Reading the
      # banner also proves vsftpd is answering, not merely bound.
      test: ['CMD-SHELL', 'nc -w 3 127.0.0.1 21 </dev/null | grep -q "^220 "']
      interval: 2s
      timeout: 2s
      retries: 30
